[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rankweave"
version = "0.1.0"
description = "A lightweight, framework-agnostic library for fusing multiple search rankings in search and RAG systems."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Gaurav Aggarwal" },
]
keywords = ["search", "rag", "rrf", "rank-fusion", "hybrid-search", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/GauravAgga/Riffusion"
Repository = "https://github.com/GauravAgga/Riffusion"
Issues = "https://github.com/GauravAgga/Riffusion/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
